name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/hse-competition

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hse_competition
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test --no-daemon

  build:
    needs: backend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hse-competition.matswuuu.dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not available to the '${{ github.job }}' job (environment: production)"
              missing=1
            fi
          done
          exit $missing

      - name: Encode compose file
        run: echo "COMPOSE_B64=$(base64 -w0 compose.yaml)" >> "$GITHUB_ENV"

      - name: Upload compose file, write .env, pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_SHA: ${{ github.sha }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'hse_competition' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || 'hse-competition.matswuuu.dev' }}
          # Optional: setting this secret switches the backend to the LLM planner.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: COMPOSE_B64,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH,IMAGE_SHA,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SITE_ADDRESS,GEMINI_API_KEY,GEMINI_MODEL
          script: |
            set -eu

            # Strip CR/LF that sneak in when secrets are pasted into the GitHub UI
            trim() { printf '%s' "$1" | tr -d '\r\n'; }
            DEPLOY_PATH=$(trim "$DEPLOY_PATH")
            POSTGRES_DB=$(trim "$POSTGRES_DB")
            POSTGRES_USER=$(trim "$POSTGRES_USER")
            POSTGRES_PASSWORD=$(trim "$POSTGRES_PASSWORD")
            SITE_ADDRESS=$(trim "$SITE_ADDRESS")
            GEMINI_API_KEY=$(trim "${GEMINI_API_KEY:-}")
            GEMINI_MODEL=$(trim "${GEMINI_MODEL:-}")

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            printf '%s' "$COMPOSE_B64" | base64 -d > compose.yaml

            if [ -z "$POSTGRES_PASSWORD" ]; then
              echo "POSTGRES_PASSWORD secret is not set" >&2
              exit 1
            fi
            case "$POSTGRES_DB$POSTGRES_USER$POSTGRES_PASSWORD$SITE_ADDRESS$GEMINI_API_KEY$GEMINI_MODEL" in *"'"*)
              echo "DB settings, SITE_ADDRESS and Gemini settings must not contain single quotes" >&2
              exit 1
            esac

            # Values are single-quoted so compose takes them literally (no $ interpolation)
            umask 077
            {
              echo "IMAGE_TAG='sha-$(echo "$IMAGE_SHA" | cut -c1-7)'"
              echo "POSTGRES_DB='$POSTGRES_DB'"
              echo "POSTGRES_USER='$POSTGRES_USER'"
              echo "POSTGRES_PASSWORD='$POSTGRES_PASSWORD'"
              echo "SITE_ADDRESS='$SITE_ADDRESS'"
              if [ -n "$GEMINI_API_KEY" ]; then
                echo "SPRING_PROFILES_ACTIVE='llm'"
                echo "GEMINI_API_KEY='$GEMINI_API_KEY'"
                echo "GEMINI_MODEL='$GEMINI_MODEL'"
              fi
            } > .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull backend caddy
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
