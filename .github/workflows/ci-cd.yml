name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/hse-competition
  # Backend the mobile apps talk to; inlined into their web bundle at build time.
  MOBILE_API_URL: https://${{ vars.SITE_ADDRESS || 'hse-competition.matswuuu.dev' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hse_competition
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test --no-daemon

  build:
    needs: backend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
          # Built from the repo root so the image can see the shared workspace package.
          - component: frontend
            context: .
    steps:
      - uses: actions/checkout@v5

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hse-competition.matswuuu.dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not available to the '${{ github.job }}' job (environment: production)"
              missing=1
            fi
          done
          exit $missing

      - name: Encode compose file
        run: echo "COMPOSE_B64=$(base64 -w0 compose.yaml)" >> "$GITHUB_ENV"

      - name: Upload compose file, write .env, pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_SHA: ${{ github.sha }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'hse_competition' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || 'hse-competition.matswuuu.dev' }}
          # Optional: setting this secret switches the backend to the LLM planner.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: COMPOSE_B64,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH,IMAGE_SHA,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SITE_ADDRESS,GEMINI_API_KEY,GEMINI_MODEL
          script: |
            set -eu

            # Strip CR/LF that sneak in when secrets are pasted into the GitHub UI
            trim() { printf '%s' "$1" | tr -d '\r\n'; }
            DEPLOY_PATH=$(trim "$DEPLOY_PATH")
            POSTGRES_DB=$(trim "$POSTGRES_DB")
            POSTGRES_USER=$(trim "$POSTGRES_USER")
            POSTGRES_PASSWORD=$(trim "$POSTGRES_PASSWORD")
            SITE_ADDRESS=$(trim "$SITE_ADDRESS")
            GEMINI_API_KEY=$(trim "${GEMINI_API_KEY:-}")
            GEMINI_MODEL=$(trim "${GEMINI_MODEL:-}")

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            printf '%s' "$COMPOSE_B64" | base64 -d > compose.yaml

            if [ -z "$POSTGRES_PASSWORD" ]; then
              echo "POSTGRES_PASSWORD secret is not set" >&2
              exit 1
            fi
            case "$POSTGRES_DB$POSTGRES_USER$POSTGRES_PASSWORD$SITE_ADDRESS$GEMINI_API_KEY$GEMINI_MODEL" in *"'"*)
              echo "DB settings, SITE_ADDRESS and Gemini settings must not contain single quotes" >&2
              exit 1
            esac

            # Values are single-quoted so compose takes them literally (no $ interpolation)
            umask 077
            {
              echo "IMAGE_TAG='sha-$(echo "$IMAGE_SHA" | cut -c1-7)'"
              echo "POSTGRES_DB='$POSTGRES_DB'"
              echo "POSTGRES_USER='$POSTGRES_USER'"
              echo "POSTGRES_PASSWORD='$POSTGRES_PASSWORD'"
              echo "SITE_ADDRESS='$SITE_ADDRESS'"
              if [ -n "$GEMINI_API_KEY" ]; then
                echo "SPRING_PROFILES_ACTIVE='llm'"
                echo "GEMINI_API_KEY='$GEMINI_API_KEY'"
                echo "GEMINI_MODEL='$GEMINI_MODEL'"
              fi
            } > .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull backend caddy
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f

  js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace shared
      - run: npm run typecheck --workspace frontend
      - run: npm run lint --workspace frontend

  # The Android and iOS apps are the frontend in a Capacitor WebView.
  mobile-android:
    needs: js-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --workspace frontend

      - run: npm run build
        env:
          VITE_API_URL: ${{ env.MOBILE_API_URL }}
      - run: npx cap sync android

      # Without the keystore secret, the committed public debug key signs the APK (see app/build.gradle).
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the public debug key"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Store versions must grow with every build; the run number does.
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName="$(jq -r .version ../package.json)"
          rm -f "$RUNNER_TEMP/release.jks"

      - run: mv android/app/build/outputs/apk/release/app-release.apk hse-competition.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: frontend/hse-competition.apk
          if-no-files-found: error

  mobile-ios:
    needs: js-check
    # Capacitor 8 needs Xcode 26.
    runs-on: macos-26
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspace frontend

      - run: npm run build
        env:
          VITE_API_URL: ${{ env.MOBILE_API_URL }}
      - run: npx cap sync ios

      # No Apple signing identity in CI: the IPA is unsigned and must be re-signed to install
      # (e.g. with AltStore or Sideloadly, or `xcrun` + a provisioning profile).
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            MARKETING_VERSION="$(jq -r .version package.json)" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/frontend/hse-competition-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: frontend/hse-competition-unsigned.ipa
          if-no-files-found: error

  mobile-release:
    needs: [backend-test, mobile-android, mobile-ios]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Only the app builds: the run also holds docker/build-push-action's .dockerbuild records.
      - uses: actions/download-artifact@v5
        with:
          pattern: "{android,ios}"
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version frontend/package.json)
          tag="mobile-v$version-${{ github.run_number }}"
          {
            echo "Mobile build $version (${{ github.run_number }}) from ${GITHUB_SHA::7}."
            echo
            echo "- \`hse-competition.apk\`: Android, install directly (allow installs from unknown sources)."
            echo "- \`hse-competition-unsigned.ipa\`: iOS, unsigned; re-sign it to install on a device."
          } > notes.md
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Mobile $version (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
