<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7fbf1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10140f" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HSE Competition</title>
    <script>
      // Apply the color scheme before first paint, as MUI will (key: THEME_STORAGE_KEY in @hse/shared/theme).
      let theme = null
      try {
        theme = localStorage.getItem('theme')
      } catch {}
      if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', theme)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
