# Default dishes for the code-only planner (DefaultMealsProperties, prefix "meals").
#
# DishSeeder inserts every dish whose name is not in the `dishes` table yet, and adds
# missing recipe-urls to dishes that already exist. Nothing else in the DB is overwritten,
# so edits made there are kept.
#
# Fields:
#   name              unique dish name shown to the user
#   slots             BREAKFAST | LUNCH | DINNER | SNACK (SNACK also fills SNACK_2)
#   cooking-time-min  total cooking time, minutes
#   ingredients       product must match a name in products.csv; grams = template portion
#                     before portion fitting
#   steps             short cooking steps, in order
#   recipe-urls       external pages with a fuller recipe of the same or a close dish
